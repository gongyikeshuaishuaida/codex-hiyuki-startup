name: Package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium
      - name: Check packaged video codec in test browsers
        run: node tools/probe-media.mjs
      - run: npm run test:browser
      - name: Compile startup gate
        shell: powershell
        run: .\tools\build-startup-gate.ps1
      - name: Parse installer scripts
        shell: powershell
        run: |
          Get-ChildItem tools -Filter *.ps1 | ForEach-Object {
            $parseTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
